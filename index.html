<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Power Scale Ladder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  /* One visual world: a night-time control room. Stage canvas on top, controls in a console below. */
  --bg:#07090d; --panel:#10151c; --ink:#e9eef2; --muted:#8a97a3; --line:#222c36;
  --amber:#ffb547; --hot:#ff5a36; --cool:#5fd3ff;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.45}
.wrap-unused{max-width:1320px;margin:0 auto;padding:14px 16px 40px;display:flex;flex-direction:column;gap:12px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px}
h1{font-family:var(--display);font-weight:700;font-size:2rem;line-height:1;margin:0;letter-spacing:.02em;text-transform:uppercase}
h1 span{color:var(--amber)}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab,.chip{font:500 .92rem var(--body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer}
.tab:hover,.chip:hover{border-color:var(--amber)}
.tab.on{background:var(--amber);border-color:var(--amber);color:#1a1205;font-weight:600}
.chip.on{border-color:var(--amber);color:var(--amber)}
:focus-visible{outline:2px solid var(--cool);outline-offset:2px}
.stage{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#000}
canvas#stage{display:block;width:100%;aspect-ratio:16/9;max-height:62vh;min-height:320px}
.hud{position:absolute;left:18px;top:14px;pointer-events:none;max-width:min(560px,80%);text-shadow:0 2px 12px #000}
.hud .big{font-family:var(--display);font-weight:700;font-size:clamp(2.4rem,6vw,4.6rem);line-height:.95;color:var(--amber);font-variant-numeric:tabular-nums}
.hud .cap{font-size:clamp(.95rem,1.6vw,1.2rem);margin-top:6px}
.hud .cap b{color:var(--amber);font-weight:600}
.hud .sm{font-size:.85rem;color:var(--muted);margin-top:4px}
.status{display:inline-block;margin-top:8px;font:600 .85rem var(--body);padding:3px 10px;border-radius:999px;border:1px solid currentColor}
.ok{color:#6ee39a}.warn{color:var(--amber)}.bad{color:var(--hot)}
.console{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ctl label{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;min-width:72px}
input[type=range]{flex:1;min-width:200px;accent-color:var(--amber);height:30px}
.val{font:500 1.2rem var(--mono);min-width:7.5rem;text-align:right;color:var(--amber)}
.note{font-size:.8rem;color:var(--muted);max-width:90ch}
.hide{display:none!important}

.app{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100%}
.side{background:var(--panel);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;align-self:start}
.brand{font-family:var(--display);font-weight:700;font-size:1.6rem;line-height:1;text-transform:uppercase;letter-spacing:.02em}
.brand span{color:var(--amber)}
.tabs{display:flex;flex-direction:column;gap:6px}
.tab{display:flex;flex-direction:column;align-items:flex-start;text-align:left;border-radius:10px;padding:10px 12px}
.tab b{font-family:var(--display);font-size:1.35rem;font-weight:600;letter-spacing:.02em;line-height:1.05}
.tab small{font-size:.78rem;color:var(--muted)}
.tab.on small{color:#3b2a08}
.lect{font:600 .95rem var(--body);background:transparent;color:var(--cool);border:1px solid var(--cool);border-radius:10px;padding:10px 12px;cursor:pointer;text-align:left}
.lect.on{background:var(--cool);color:#04121a}
.side-note{font-size:.75rem;color:var(--muted);margin-top:auto}
.main{padding:14px 16px 40px;display:flex;flex-direction:column;gap:12px;min-width:0}
.cols{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.card h2{font-family:var(--display);font-weight:600;font-size:1.25rem;margin:0;text-transform:uppercase;letter-spacing:.05em}
.card h3{font:600 .78rem var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:6px 0 0}
.param{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.phead{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600}
.phead i{font-family:var(--mono);font-style:normal;color:var(--amber)}
.fx{font:600 .78rem var(--mono);color:var(--cool);background:transparent;border:1px solid rgba(95,211,255,.45);border-radius:6px;padding:3px 8px;cursor:pointer}
.fx:hover,.fx.on{background:rgba(95,211,255,.14);border-color:var(--cool)}
.readings{display:flex;flex-direction:column}
.rd{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line)}
.rd .rv{font:500 1rem var(--mono);color:var(--amber);font-variant-numeric:tabular-nums;text-align:right}
.notes h4{font:600 .78rem var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:10px 0 2px}
#notes h2{margin-bottom:2px}
#notes p{margin:0 0 4px;max-width:65ch}
#notes ul{margin:0;padding-left:18px}
.mathbox{background:#0a1118;border:1px solid rgba(95,211,255,.45);border-radius:10px;padding:12px 14px}
.mathbox .mt{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mathbox .mt b{font-family:var(--display);font-size:1.25rem;font-weight:600;color:var(--cool)}
.fml{font:500 1.15rem var(--mono);background:#060b10;border-radius:8px;padding:10px 12px;margin:8px 0;overflow-x:auto;color:var(--ink)}
.fml sub,.fml sup{font-size:.7em}
.mathbox dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:6px 0;font-size:.92rem}
.mathbox dt{font-family:var(--mono);color:var(--amber)}
.mathbox dd{margin:0;color:var(--muted)}
.mathbox .ex{border-left:3px solid var(--amber);padding:6px 10px;margin-top:8px;font-size:.95rem}
.mathbox .ex code{font-family:var(--mono);color:var(--amber)}
.lecbar{display:flex;align-items:center;gap:10px;background:#081620;border:1px solid var(--cool);border-radius:12px;padding:10px 12px}
.ltext{flex:1;min-width:0}
.lstep{font:600 .8rem var(--body);color:var(--cool);text-transform:uppercase;letter-spacing:.08em}
#lsay{font-size:1.05rem}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  .tabs{flex-direction:row;flex-wrap:wrap}
  .tab{flex:1;min-width:130px}
  .side-note{display:none}
  .cols{grid-template-columns:1fr}
}
@media (max-width:700px){.hud{position:static;max-width:none;padding:12px 14px;background:var(--panel);border-top:1px solid var(--line);text-shadow:none}.hud .big{font-size:2.3rem}canvas#stage{min-height:260px}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <div class="brand">Power <span>Scale</span> Ladder</div>
  <nav class="tabs" aria-label="Quantities">
    <button class="tab on" data-mode="city"><b>Power</b><small>Light a city</small></button>
    <button class="tab" data-mode="impact"><b>Energy</b><small>Impact test</small></button>
    <button class="tab" data-mode="wire"><b>Current</b><small>Current on a wire</small></button>
    <button class="tab" data-mode="arc"><b>Voltage</b><small>Too close to a line</small></button>
  </nav>
  <button class="lect" id="lect" aria-pressed="false">▶ Lecture mode</button>
  <p class="side-note">Units: W (watt), kW = 1,000 W, MW = 1,000,000 W, GW = 1,000,000,000 W.</p>
</aside>
<main class="main">
  <div class="lecbar hide" id="lecbar" aria-live="polite">
    <button class="chip" id="lprev" aria-label="Previous step">◀</button>
    <div class="ltext"><div class="lstep" id="lstep"></div><div id="lsay"></div></div>
    <button class="chip" id="lnext" aria-label="Next step">▶</button>
    <button class="chip" id="lexit">Exit</button>
  </div>
  <div class="stage">
    <canvas id="stage" aria-label="Animated scene"></canvas>
    <div class="hud" aria-live="polite"><div class="big" id="hbig"></div><div class="cap" id="hcap"></div><div class="sm" id="hsm"></div><div id="hstat"></div></div>
  </div>
  <div class="cols">
    <section class="card" aria-labelledby="h-par">
      <h2 id="h-par">Parameters</h2>
      <div class="param" data-modes="city impact wire">
        <div class="phead"><span>Power <i>P</i></span><button class="fx" data-math="power">ƒ maths</button></div>
        <div class="ctl" id="prow"><input id="pw" type="range" min="0" max="9.3" step="0.01" value="4.7" aria-label="Power"><div class="val" id="pwv"></div></div>
        <div class="ctl" id="presets" aria-label="Power presets"></div>
      </div>
      <div class="param" data-modes="wire arc">
        <div class="phead"><span>Line voltage <i>V</i></span><button class="fx" data-math="voltage">ƒ maths</button></div>
        <div class="ctl" id="vrow" aria-label="Line voltage"></div>
      </div>
      <div class="param" data-modes="impact">
        <div class="phead"><span>Running time <i>t</i></span><button class="fx" data-math="energy">ƒ maths</button></div>
        <div class="ctl" id="drow" aria-label="Running time"></div>
      </div>
      <div class="param" data-modes="impact">
        <div class="phead"><span>Target</span><button class="fx" data-math="target">ƒ maths</button></div>
        <div class="ctl" id="trow" aria-label="Target"></div>
      </div>
      <div class="param" data-modes="arc">
        <div class="phead"><span>Object carried</span><button class="fx" data-math="object">ƒ maths</button></div>
        <div class="ctl" id="orow" aria-label="Object"></div>
      </div>
      <div class="param" data-modes="arc">
        <div class="phead"><span>Gap to the line <i>d</i></span><button class="fx" data-math="gap">ƒ maths</button></div>
        <div class="ctl" id="grow"><input id="gap" type="range" min="0" max="1000" step="1" value="700" aria-label="Gap"><div class="val" id="gapv"></div></div>
        <div class="ctl"><button class="chip" id="walk">Walk closer ▶</button><button class="chip" id="reset">Step back</button></div>
      </div>
      <h3>Live readings</h3>
      <div id="readings" class="readings"></div>
    </section>
    <section class="card" aria-labelledby="h-ex">
      <div id="mathbox" class="mathbox hide" role="region" aria-label="Maths"></div>
      <div id="notes"></div>
      <p class="note" id="note"></p>
    </section>
  </div>
</main>
</div>
<script>
// ================= shared =================
const cv=document.getElementById('stage'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const $=id=>document.getElementById(id);
const S={obj:'ladder',mode:'city',P:5e4,vi:2,dur:1,tgt:'water',run0:performance.now()};
function nice(x){ if(!isFinite(x)) return '∞'; const a=Math.abs(x);
  if(a>=1e4) return Math.round(x).toLocaleString(); if(a>=100) return Math.round(x).toLocaleString();
  if(a>=10) return (Math.round(x*10)/10).toLocaleString(); if(a>=1) return (Math.round(x*100)/100).toLocaleString();
  return Number(x.toPrecision(2)).toLocaleString(); }
function big(x){ if(x>=1e9) return nice(x/1e9)+' billion'; if(x>=1e6) return nice(x/1e6)+' million'; return nice(x); }
function fP(w){ for(const [f,s] of [[1e9,'GW'],[1e6,'MW'],[1e3,'kW']]) if(w>=f) return nice(w/f)+' '+s; return nice(w)+' W'; }
function fE(wh){ for(const [f,s] of [[1e9,'GWh'],[1e6,'MWh'],[1e3,'kWh']]) if(wh>=f) return nice(wh/f)+' '+s; return nice(wh)+' Wh'; }
function fI(a){ if(a>=1e3) return nice(a/1e3)+' kA'; if(a>=1) return nice(a)+' A'; return nice(a*1e3)+' mA'; }
function fM(m){ if(m>=1e3) return nice(m/1e3)+' km'; if(m>=1) return nice(m)+' m'; return nice(m*100)+' cm'; }
function resize(){ DPR=Math.min(2,window.devicePixelRatio||1); const r=cv.getBoundingClientRect(); W=r.width; H=r.height;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR); ctx.setTransform(DPR,0,0,DPR,0,0); cache.dirty=true; }
const glow=document.createElement('canvas'); glow.width=glow.height=64;
{const g=glow.getContext('2d'),gr=g.createRadialGradient(32,32,0,32,32,32);
 gr.addColorStop(0,'rgba(255,240,200,1)');gr.addColorStop(.12,'rgba(255,205,125,.85)');gr.addColorStop(.45,'rgba(255,150,60,.16)');gr.addColorStop(1,'rgba(255,120,40,0)');
 g.fillStyle=gr;g.fillRect(0,0,64,64);}
const blue=document.createElement('canvas'); blue.width=blue.height=32;
{const g=blue.getContext('2d'),gr=g.createRadialGradient(16,16,0,16,16,16);
 gr.addColorStop(0,'rgba(230,250,255,1)');gr.addColorStop(.25,'rgba(95,211,255,.8)');gr.addColorStop(1,'rgba(95,211,255,0)');g.fillStyle=gr;g.fillRect(0,0,32,32);}
function hud(bigT,cap,sm,stat){ $('hbig').textContent=bigT; $('hcap').innerHTML=cap||''; $('hsm').innerHTML=sm||''; $('hstat').innerHTML=stat||''; }
function lerp(a,b,k){ return a+(b-a)*k; }

// ================= scene 1: light a city =================
// Top-down night map. 1 home = 1 kW of average evening demand. Homes sit on a 15 m grid with a road every 6th row.
const POS=(()=>{const a=[],R=112;
  for(let x=-R;x<=R;x++)for(let y=-R;y<=R;y++){ if(((x%6)+6)%6===0||((y%6)+6)%6===0) continue;
    const h=Math.sin(x*12.9898+y*78.233)*43758.5453, j=h-Math.floor(h); a.push([x,y,x*x+y*y+j*40]); }
  a.sort((p,q)=>p[2]-q[2]);
  return a.slice(0,30000).map(p=>{const h=Math.sin(p[0]*39.3+p[1]*11.7)*9631.1, j=h-Math.floor(h); return [p[0]+(j-.5)*.35,p[1]+((j*7)%1-.5)*.35];});})();
const city={lit:Math.log10(50),cam:0,init:false};
const cache={c:document.createElement('canvas'),dirty:true,lit:NaN,cam:NaN};
function settlement(n){ if(n<1) return 'part of one home'; if(n<2) return 'one home'; if(n<15) return 'a few homes';
  if(n<400) return 'a village'; if(n<15000) return 'a town'; if(n<250000) return 'a city'; return 'a large city, or a small country'; }
function cityTargets(){ const n=Math.max(S.P/1000,1e-3); return n; }
function drawCity(t){
  const nT=cityTargets();
  city.lit=RM?Math.log10(nT):lerp(city.lit,Math.log10(nT),.06);
  const n=Math.pow(10,city.lit);
  const blocks=n>24000, unit=blocks?100:1, cell=blocks?150:15, nu=n/unit;
  const r=Math.sqrt(Math.max(nu,2.2)*36/25/Math.PI)*cell;
  const camT=Math.log10(0.34*Math.min(W,H)/r);
  if(!city.init){city.cam=camT;city.init=true;}
  city.cam=RM?camT:lerp(city.cam,camT,.06);
  const sc=Math.pow(10,city.cam), cx=W*.56, cy=H*.54;
  const moving=Math.abs(city.cam-cache.cam)>1e-4||Math.abs(city.lit-cache.lit)>1e-4||cache.dirty;
  const cc=cache.c;
  if(moving){
    if(cc.width!==cv.width||cc.height!==cv.height){cc.width=cv.width;cc.height=cv.height;}
    const g=cc.getContext('2d'); g.setTransform(DPR,0,0,DPR,0,0);
    g.fillStyle='#04060a'; g.fillRect(0,0,W,H);
    const sz=cell*sc, nDraw=Math.min(POS.length,Math.max(Math.ceil(nu*3.2),400));
    // unlit homes
    g.fillStyle=blocks?'#141b24':'#18202a';
    const ds=Math.max(sz*(blocks?.82:.62),0.9);
    for(let i=Math.ceil(nu);i<nDraw;i++){ const x=cx+POS[i][0]*sz, y=cy+POS[i][1]*sz; if(x<-ds||y<-ds||x>W+ds||y>H+ds) continue; g.fillRect(x-ds/2,y-ds/2,ds,ds); }
    // lit homes
    g.globalCompositeOperation='lighter';
    const full=Math.floor(nu), frac=nu-full, gs=Math.max(sz*(blocks?1.5:1.05),2.4);
    const lim=Math.min(full,POS.length);
    for(let i=0;i<=lim&&i<POS.length;i++){
      const a=i<full?1:frac; if(a<=0.001) continue;
      const x=cx+POS[i][0]*sz, y=cy+POS[i][1]*sz; if(x<-gs||y<-gs||x>W+gs||y>H+gs) continue;
      g.globalAlpha=a*(blocks?0.9:0.8); g.drawImage(glow,x-gs,y-gs,gs*2,gs*2);
    }
    g.globalAlpha=1; g.globalCompositeOperation='source-over';
    // houses visible as buildings when zoomed in
    if(!blocks&&sz>9){
      for(let i=0;i<Math.min(nDraw,4000);i++){ const x=cx+POS[i][0]*sz, y=cy+POS[i][1]*sz; if(x<-sz||y<-sz||x>W+sz||y>H+sz) continue;
        const hs=sz*.62; g.strokeStyle=i<full?'rgba(255,210,140,.55)':'rgba(120,135,150,.35)'; g.lineWidth=1; g.strokeRect(x-hs/2,y-hs/2,hs,hs); }
    }
    // single home close-up: LED bulbs
    if(n<1.05){
      const sz2=cell*sc, x=cx+POS[0][0]*sz2, y=cy+POS[0][1]*sz2, hs=sz2*.62;
      g.fillStyle='#0d1218'; g.fillRect(x-hs/2,y-hs/2,hs,hs);
      const nb=Math.min(100,Math.round(S.P/10)); g.globalCompositeOperation='lighter';
      for(let k=0;k<100;k++){ const bx=x-hs/2+hs*(.08+.84*((k%10)+.5)/10), by=y-hs/2+hs*(.08+.84*(Math.floor(k/10)+.5)/10);
        if(k<nb){ g.drawImage(glow,bx-hs*.06,by-hs*.06,hs*.12,hs*.12);} }
      g.globalCompositeOperation='source-over';
      for(let k=nb;k<100;k++){ const bx=x-hs/2+hs*(.08+.84*((k%10)+.5)/10), by=y-hs/2+hs*(.08+.84*(Math.floor(k/10)+.5)/10); g.fillStyle='#1e2731'; g.fillRect(bx-1,by-1,2,2); }
    }
    cache.cam=city.cam; cache.lit=city.lit; cache.dirty=false;
  }
  ctx.setTransform(1,0,0,1,0,0); ctx.drawImage(cc,0,0); ctx.setTransform(DPR,0,0,DPR,0,0);
  // feeder line with flowing charge
  const rpx=Math.max(r*sc,12), ex=cx-rpx*.9;
  ctx.strokeStyle='rgba(95,211,255,.25)'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(0,cy); ctx.lineTo(ex,cy); ctx.stroke();
  const k=Math.round(8+5*Math.log10(S.P+1)), ps=2+Math.log10(S.P+1)*.9;
  ctx.globalCompositeOperation='lighter';
  for(let i=0;i<k;i++){ const f=((RM?0:t/2600)+i/k)%1, x=f*ex; ctx.drawImage(blue,x-ps*2,cy-ps*2,ps*4,ps*4); }
  ctx.globalCompositeOperation='source-over';
  // scale bar
  scaleBar(sc);
  const hn=S.P/1000;
  hud(fP(S.P), hn<1?`Lights <b>${Math.round(S.P/10)}</b> LED bulbs (10 W each) inside one home`:`Lights about <b>${big(hn)}</b> homes · ${settlement(hn)}`,
      hn<1?'Zoomed in on one home.':`Each glow is ${blocks?'a block of 100 homes':'one home'}. The camera pulls back as the power grows.`);
}
function scaleBar(sc){
  const target=W*.16, m=target/sc, p=Math.pow(10,Math.floor(Math.log10(m))); let v=p; for(const f of [1,2,5]) if(p*f<=m) v=p*f;
  const px=v*sc, x=W-24-px, y=H-24;
  ctx.strokeStyle='rgba(233,238,242,.8)'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(x,y-6); ctx.lineTo(x,y); ctx.lineTo(x+px,y); ctx.lineTo(x+px,y-6); ctx.stroke();
  ctx.fillStyle='rgba(233,238,242,.9)'; ctx.font="500 12px 'IBM Plex Mono',monospace"; ctx.textAlign='center'; ctx.fillText(fM(v),x+px/2,y-10);
}

// ================= scene 2: current on a wire =================
const VL=[ {l:'230 V',v:230,ph:1,h:8,ins:.15},{l:'400 V',v:400,ph:3,h:9,ins:.15},{l:'11 kV',v:11e3,ph:3,h:11,ins:.25},
  {l:'33 kV',v:33e3,ph:3,h:14,ins:.44},{l:'132 kV',v:132e3,ph:3,h:28,ins:1.3},{l:'225 kV',v:225e3,ph:3,h:38,ins:2.05},{l:'400 kV',v:400e3,ph:3,h:48,ins:3.36} ];

function strokePts(pts,col,w){ ctx.strokeStyle=col; ctx.lineWidth=w; ctx.lineCap='round'; ctx.beginPath(); let pen=false;

    for(let k=1;k<6;k++){ const f=k/6, y=lerp(gy,top,f), w=lerp(bw,tw,f); ctx.moveTo(x-w,y); ctx.lineTo(x+w,y); const y2=lerp(gy,top,(k-1)/6), w2=lerp(bw,tw,(k-1)/6); ctx.moveTo(x-w2,y2); ctx.lineTo(x+w,y); }

function person(x,gy,sc){ const h=1.75*sc; ctx.strokeStyle='#e9eef2'; ctx.fillStyle='#e9eef2'; ctx.lineWidth=Math.max(1.2,h*.05);

// ================= scene 3: impact test =================
const DUR=[['1 minute',1/60],['1 hour',1],['1 day',24],['1 month',730],['1 year',8760]];
const TG=[['water','Boil water'],['lift','Lift a car'],['diesel','Diesel it replaces']];
const RUN=7000;
const MARKS=[[1.75,'Person'],[8,'House'],[30,'10-storey building'],[1945,'Mount Bintumani (Sierra Leone)'],[10000,'Cruising jet'],[100000,'Edge of space'],[400000,'Space station'],[384400000,'The Moon']];
const imp={top:5,steam:[]};
function impactProg(t){ return Math.min(1,(t-S.run0)/RUN); }
function containers(q,list){ // choose the unit giving the most containers up to 120
  let u=list[list.length-1]; for(const c of list){ if(q/c[0]<=120){u=c;break;} } return u; }
function drawImpact(t){
  const p=impactProg(t), hrs=DUR[S.dur][1], E=S.P*hrs*p, kwh=E/1000;
  ctx.fillStyle='#05070b'; ctx.fillRect(0,0,W,H);
  const clock=`${fP(S.P)} for ${DUR[S.dur][0]} = ${fE(S.P*hrs)}`;
  if(S.tgt==='lift'){ drawLift(E*3600,p,clock); return; }
  const water=S.tgt==='water';
  const q=water? kwh*3.6e6/(4186*75) : kwh/3; // litres
  const qF=water? S.P*hrs/1000*3.6e6/(4186*75) : S.P*hrs/1000/3;
  const list=water? [[0.25,'cups'],[1.7,'kettles'],[200,'200 L drums'],[30000,'water tankers (30,000 L)'],[2.5e6,'Olympic pools (2.5 million L)']]
                  : [[1,'1 L bottles'],[20,'20 L jerrycans'],[200,'200 L drums'],[30000,'fuel tankers (30,000 L)'],[2.5e6,'Olympic pools of diesel']];
  const u=containers(qF,list), nF=qF/u[0], n=q/u[0];
  const cols=Math.ceil(Math.sqrt(Math.max(1,Math.ceil(nF))*W/H*.9)), rows=Math.ceil(Math.max(1,Math.ceil(nF))/cols);
  const top=H*.36, ah=H*.58, cw=Math.min((W*.9)/cols,(ah/rows)/1.15), chh=cw*1.15, ox=(W-cols*cw)/2;
  const full=Math.floor(n), frac=n-full;
  for(let i=0;i<Math.max(1,Math.ceil(nF));i++){
    const x=ox+(i%cols)*cw+cw*.12, y=top+Math.floor(i/cols)*chh+chh*.12, w=cw*.76, h=chh*.76;
    const a=i<full?1:i===full?frac:0;
    ctx.strokeStyle='#3a4653'; ctx.lineWidth=Math.max(1,w*.03); ctx.strokeRect(x,y,w,h);
    if(a>0){ ctx.fillStyle=water?'rgba(95,211,255,.75)':'rgba(255,170,60,.8)'; ctx.fillRect(x+1,y+h*(1-a),w-2,h*a);

    water? `of water brought to the boil from 25 °C · <b>${big(n)}</b> ${u[1]}` : `of diesel a generator would burn to make the same electricity · <b>${big(n)}</b> ${u[1]}`,
    clock+(water?'. Heating only: no losses, no evaporation.':'. Assumes about 3 kWh of electricity per litre.'));
}
function drawLift(E,p,clock){
  const m=1500, h=E/(m*9.81);
  const topT=Math.max(h*1.35,6);
  imp.top=RM?topT:Math.max(topT,lerp(imp.top,topT,.08));
  const gy=H*.9, sc=(H*.78)/imp.top, x=W*.62;
  const sk=ctx.createLinearGradient(0,0,0,gy); sk.addColorStop(0,'#02030a'); sk.addColorStop(1,'#0c1622'); ctx.fillStyle=sk; ctx.fillRect(0,0,W,gy);

  MARKS.forEach(([mh,name],i)=>{ const y=gy-mh*sc; if(y<10) return;

  });
  if(hidden.length){ ctx.fillStyle='rgba(255,181,71,.9)'; ctx.textAlign='left'; ctx.fillText(`Squashed flat at this scale: ${hidden.reverse().join(', ')}`,W*.03,gy+18); }
  // rope trail and car
  const cy=gy-h*sc;
  ctx.strokeStyle='rgba(255,181,71,.6)'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(x,gy); ctx.lineTo(x,cy); ctx.stroke();
  ctx.globalCompositeOperation='lighter'; ctx.drawImage(glow,x-26,cy-26,52,52); ctx.globalCompositeOperation='source-over';

  if(4.5*sc<26){ ctx.fillStyle='rgba(138,151,163,.9)'; ctx.textAlign='center'; ctx.font="500 11px 'IBM Plex Sans',sans-serif"; ctx.fillText('car enlarged to be visible',x,cy+14); }
  timeBar(p);
  const passed=MARKS.filter(mk=>mk[0]<=h).pop();
  hud(fM(h), `A 1.5-tonne car lifted straight up${passed?` · higher than: <b>${passed[1]}</b>`:''}`, clock+'. Uses E = mgh, g = 9.81 m/s², no losses, no air resistance.');

function timeBar(p){ const y=H-10; ctx.fillStyle='#1a222c'; ctx.fillRect(0,y,W,10); ctx.fillStyle='#ffb547'; ctx.fillRect(0,y,W*p,10); }


// ================= scene 4: too close (arc flash) =================
// Flashover gap: rough rod-to-plane breakdown of about 500 kV per metre of air at the phase-to-ground peak voltage.
// Body current after contact: phase-to-ground voltage across about 1,000 ohms of body and ground path.
const OBJ=[['Aluminium ladder','ladder'],['Crane boom','crane']];
const arcS={gap:5,walking:false,flash:0,struck:false,sparks:[],t0:0};
function flashGap(o){ const vpk=o.v*Math.SQRT2/(o.ph===3?Math.sqrt(3):1); return Math.max(vpk/5e5, vpk/3e6); }

  ctx.fillStyle='rgba(255,90,54,.95)'; ctx.fillText(`spark can jump ${fM(fg)}`,px+Math.max(fg*sc,2)+8,att+Math.max(fg*sc,2)+16);

    ctx.beginPath(); ctx.moveTo(bx,gy); ctx.lineTo(tipX,tipY); ctx.moveTo(bx+0.45*sc,gy); ctx.lineTo(tipX+0.45*sc,tipY);

    cap=`At ${o.l} the current jumped <b>${fM(fg)}</b> of air without any touch. About <b>${fI(Ib)}</b> would flow through the person, ${big(Ib/0.1)}× the 100 mA that can stop a heart. The arc itself can reach about 19,000 °C.`; }
  else if(arcS.gap<ap){ stat=`<span class="status warn">Inside the keep-out zone</span>`; cap=`The ladder is <b>${fM(arcS.gap)}</b> from a <b>${o.l}</b> line. Nothing has happened yet, but this is where people die. One gust or slip and the gap closes.`; }
  else { stat=`<span class="status ok">Outside the keep-out zone</span>`; cap=`The ladder is <b>${fM(arcS.gap)}</b> from a <b>${o.l}</b> line. Press <b>Walk closer</b> to see what happens.`; }
  hud(o.l, cap, 'Keep-out: US OSHA distance for non-electrical workers. Spark distance is a rough estimate of air breakdown (about 500 kV per metre); real values depend on weather and shape.', stat);
}

// ================= controls =================
const PRE=[['LED bulb',10],['Kettle 2 kW',2e3],['10 kW',1e4],['50 kW',5e4],['Generator 400 kW',4e5],['1 MW',1e6],['Bumbuna 50 MW',5e7],['1 GW',1e9]];
function setP(w,fromSlider){ S.P=w; $('pwv').textContent=fP(w); if(!fromSlider) $('pw').value=Math.log10(w);
  document.querySelectorAll('#presets .chip').forEach(b=>b.classList.toggle('on',+b.dataset.w===w)); cache.dirty=true; if(S.mode==='impact') S.run0=performance.now(); }
PRE.forEach(([t,w])=>{ const b=document.createElement('button'); b.className='chip'; b.textContent=t; b.dataset.w=w; b.onclick=()=>setP(w); $('presets').appendChild(b); });
$('pw').addEventListener('input',()=>{ const v=Math.pow(10,+$('pw').value); setP(Number(v.toPrecision(2)),true); });
function chips(row,items,key,on){ items.forEach((it,i)=>{ const b=document.createElement('button'); b.className='chip'; b.textContent=it[0]; b.onclick=()=>{ S[key]=on(i); if(key==='vi'||key==='obj'){ arcS.struck=false; arcS.walking=false; const o=VL[S.vi]; arcS.gap=approach(o.v)*1.5; $('gap').value=Math.round(arcS.gap/gapMax(o)*1000);} [...$(row).querySelectorAll('.chip')].forEach((c,j)=>c.classList.toggle('on',j===i)); S.run0=performance.now(); }; $(row).appendChild(b); });
  $(row).querySelectorAll('.chip')[items.findIndex((_,i)=>on(i)===S[key])].classList.add('on'); }
chips('vrow',VL.map(o=>[o.l]),'vi',i=>i);
chips('drow',DUR,'dur',i=>i);
chips('trow',TG.map(x=>[x[1],x[0]]),'tgt',i=>TG[i][0]);
chips('orow',OBJ,'obj',i=>OBJ[i][1]);
$('gap').addEventListener('input',()=>{arcS.walking=false;setGapFromSlider();});
$('walk').onclick=()=>{ if(arcS.struck){setGapFromSlider();} arcS.walking=true; };
$('reset').onclick=()=>{ arcS.walking=false; arcS.struck=false; arcS.flash=0; const o=VL[S.vi]; arcS.gap=approach(o.v)*1.5; $('gap').value=Math.round(arcS.gap/gapMax(o)*1000); };
const NOTES={city:'1 home ≈ 1 kW of average evening demand (a teaching value; real homes vary a lot). Homes are spaced on a 15 m grid. Above 24,000 homes each glow stands for a block of 100.',
 wire:'Same conductor at every voltage, so you can see what voltage does. Current per wire: I = P / (√3 × V) for three-phase, I = P / V for 230 V. Tower heights, insulator lengths and keep-out distances (US OSHA rule for non-electrical workers) are typical values. Real lines use different conductors for each voltage.',
 arc:'For teaching only. Never approach a line to test it. Report fallen or low lines to your power company (EDSA in Sierra Leone) and keep everyone away.',
 impact:'The scene runs as a 7-second time-lapse. Change the power, time or target to run it again. Figures assume no losses.'};
function setMode(m){ S.mode=m; document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.mode===m));
  document.querySelectorAll('.param').forEach(p=>p.classList.toggle('hide',!p.dataset.modes.split(' ').includes(m)));
  if(m==='arc'){ arcS.struck=false; arcS.walking=false; arcS.flash=0; const o=VL[S.vi]; arcS.gap=approach(o.v)*1.5; $('gap').value=Math.round(arcS.gap/gapMax(o)*1000); }
  $('note').textContent=NOTES[m]; renderNotes(); closeMath(); cache.dirty=true; S.run0=performance.now(); imp.top=5; wire.init=false; city.init=city.init; renderReadings(true);
  try{history.replaceState(null,'','#'+m);}catch(e){} }
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
// ================= notes, readings, maths =================
const SCN={
 city:{t:'Power: light a city',see:'A night map seen from above. Each glow is a home switched on by the power you choose. The camera pulls back as the power grows, so small loads shrink to a speck next to big ones.',
   idea:'Power is how fast energy is used, measured in watts (W). 1 kW = 1,000 W. One home in the evening uses roughly 1 kW. Each step of ×1,000 (kW → MW → GW) is the jump from one home to a town to a whole city.',
   tryit:['Tap LED bulb, then 1 kW, then 1 MW, then 1 GW and watch the first home disappear.','Drag the slider slowly and watch the scale bar in the corner.','Ask: how many homes could Bumbuna (50 MW) light?']},
 impact:{t:'Energy: impact test',see:'The chosen power runs for the chosen time as a 7-second time-lapse, and that energy is spent on a target: boiling water, lifting a car, or the diesel a generator would burn.',
   idea:'Energy = power × time. Power is like the speed of a car and energy is the distance travelled. The unit on your electricity bill, the kWh, is 1 kW running for 1 hour.',
   tryit:['Keep the power fixed and change only the time: the result grows in proportion.','Run 2 kW (a kettle) for 1 minute, then 1 MW for 1 hour on "Lift a car".','Compare a 5 kW clinic for 1 day on "Diesel it replaces".']},
 wire:{t:'Current: current on a wire',see:'Poles or towers drawn to scale beside a person, with charge flowing along the conductor. The same wire is used at every voltage so you can see what voltage does to current.',
   idea:'For the same power, current = power ÷ voltage. Low voltage needs a huge current, which heats the wire (loss grows with current squared). That is why power is sent at high voltage and only stepped down near homes.',
   tryit:['Set 1 MW and press 230 V: the wire glows, sags and melts.','Now press 11 kV, then 400 kV: the current drops and the wire runs cool.','Watch the heat-loss reading as you change voltage.']},
 arc:{t:'Voltage: too close to a line',see:'A worker carrying a ladder or a crane boom moves toward a live line. Orange marks the keep-out zone; red marks how far a spark can jump.',
   idea:'Voltage is electrical pressure. High enough voltage pushes current through air itself, so you do not have to touch a line to be hurt. The higher the voltage, the bigger the danger distance.',
   tryit:['Press Walk closer at 230 V, then 11 kV, then 400 kV and compare the spark distance.','Switch to the crane boom: cranes are a common cause of line contact.','Read the body current after the arc and compare with 100 mA.']}
};
function renderNotes(){ const n=SCN[S.mode];
  $('notes').innerHTML=`<h2>${n.t}</h2><div class="notes"><h4>What you are seeing</h4><p>${n.see}</p><h4>Key idea</h4><p>${n.idea}</p><h4>Try this</h4><ul>${n.tryit.map(x=>`<li>${x}</li>`).join('')}</ul></div>`; }
function liveVals(){ const o=VL[S.vi], I=wireI(), hrs=DUR[S.dur][1], E=S.P*hrs;
  return {o,I,hrs,E,N:S.P/1000,vpk:o.v*Math.SQRT2/(o.ph===3?Math.sqrt(3):1),vph:o.v/(o.ph===3?Math.sqrt(3):1)}; }
function readingsFor(m){ const L=liveVals(), o=L.o;
  if(m==='city'){ const r=Math.sqrt(Math.max(L.N,1)*324/Math.PI); return [['Homes lit',L.N<1?nice(L.N)+' home':big(L.N),'homes'],['Radius of the lit area',fM(r),'zoom'],['Energy in 1 hour',fE(S.P),'energy']]; }
  if(m==='impact'){ const kwh=L.E/1000; const res=S.tgt==='water'?big(kwh*3.6e6/(4186*75))+' L boiled':S.tgt==='lift'?fM(L.E*3600/(1500*9.81))+' lift':big(kwh/3)+' L diesel'; return [['Energy E',fE(L.E),'energy'],['Result',res,'target']]; }
  if(m==='wire'){ const loss=(o.ph===3?3:2)*L.I*L.I*RKM; return [['Current per wire I',fI(L.I),'current'],['Wire load',Math.round(L.I/RATING*100)+'%','load'],['Heat lost per km',fP(loss),'loss']]; }
  const fg=flashGap(o); return [['Peak voltage to ground',fP(L.vpk).replace('W','V'),'peak'],['Spark can jump',fM(fg),'spark'],['Keep-out distance',fM(approach(o.v)),'keepout'],['Body current if struck',fI(L.vph/1000),'body']];
}
let rdKey='';
function renderReadings(force){ const rows=readingsFor(S.mode), key=S.mode+rows.map(r=>r[1]).join('|'); if(!force&&key===rdKey) return; rdKey=key;
  $('readings').innerHTML=rows.map(r=>`<div class="rd"><span>${r[0]}</span><span class="rv">${r[1]}</span><button class="fx" data-math="${r[2]}">ƒ</button></div>`).join(''); }
const MATH={
 power:L=>({t:'Power',f:'P = V × I',d:[['P','power, watts (W) = joules per second'],['V','voltage, volts (V)'],['I','current, amperes (A)']],
   ex:`Now: <code>P = ${fP(S.P)}</code> = <code>${big(S.P)} W</code>. At 230 V this needs <code>I = ${big(S.P)} ÷ 230 = ${fI(S.P/230)}</code>.`,more:'Prefixes: k = 10³, M = 10⁶, G = 10⁹. Each prefix is 1,000 times the one before.'}),
 homes:L=>({t:'Homes lit',f:'N = P ÷ P<sub>home</sub>',d:[['N','number of homes'],['P','total power'],['P<sub>home</sub>','about 1 kW per home (evening average, teaching value)']],
   ex:`<code>N = ${big(S.P)} W ÷ 1,000 W = ${L.N<1?nice(L.N):big(L.N)}</code> homes.`}),
 zoom:L=>{const r=Math.sqrt(Math.max(L.N,1)*324/Math.PI);return {t:'Why the camera pulls back',f:'A = N × a, r = √(A ÷ π)',d:[['A','area of the lit district'],['a','≈ 324 m² per home (15 m plot plus roads)'],['r','radius of the lit area']],
   ex:`<code>A = ${big(Math.max(L.N,1))} × 324 = ${big(Math.max(L.N,1)*324)} m²</code>, so <code>r = ${fM(r)}</code>.`,more:'Area grows with N but radius grows with √N: 100× more power makes the lit area only 10× wider.'};},
 energy:L=>({t:'Energy',f:'E = P × t',d:[['E','energy, watt-hours (Wh) or joules (J)'],['P','power, W'],['t','time, hours'],['1 kWh','= 1 kW for 1 h = 3.6 million J']],
   ex:`<code>E = ${fP(S.P)} × ${nice(L.hrs)} h = ${fE(L.E)}</code> = <code>${big(L.E*3600)} J</code>.`}),
 target:L=>{const kwh=L.E/1000,J=L.E*3600;
   if(S.tgt==='water') return {t:'Boiling water',f:'m = E ÷ (c × ΔT)',d:[['m','mass of water, kg (1 kg ≈ 1 L)'],['c','4,186 J/(kg·°C), specific heat of water'],['ΔT','75 °C, from 25 °C to boiling']],ex:`<code>m = ${big(J)} ÷ (4,186 × 75) = ${big(J/313950)} L</code>. Rule of thumb: 1 kWh boils about 11.5 L.`};
   if(S.tgt==='lift') return {t:'Lifting a car',f:'h = E ÷ (m × g)',d:[['h','height, m'],['m','1,500 kg car'],['g','9.81 m/s²']],ex:`<code>h = ${big(J)} ÷ (1,500 × 9.81) = ${fM(J/14715)}</code>. 1 kWh lifts the car about 245 m.`};
   return {t:'Diesel it replaces',f:'L = E ÷ (e × η)',d:[['L','litres of diesel'],['e','≈ 10 kWh of chemical energy per litre'],['η','≈ 30% generator efficiency, so ≈ 3 kWh of electricity per litre']],ex:`<code>L = ${nice(kwh)} kWh ÷ 3 = ${big(kwh/3)} L</code>.`};},
 voltage:L=>({t:'Line voltage',f:'V<sub>ph</sub> = V<sub>LL</sub> ÷ √3',d:[['V<sub>LL</sub>','line-to-line voltage, the number on the line (e.g. 11 kV)'],['V<sub>ph</sub>','phase-to-ground voltage'],['√3','≈ 1.732, from three phases 120° apart']],
   ex:L.o.ph===3?`<code>${L.o.l}</code> line: <code>V<sub>ph</sub> = ${big(L.o.v)} ÷ 1.732 = ${big(L.vph)} V</code> to ground.`:`230 V is single-phase: the full 230 V is between live and neutral.`}),
 current:L=>({t:'Current per wire',f:L.o.ph===3?'I = P ÷ (√3 × V<sub>LL</sub>)':'I = P ÷ V',d:[['I','current in each wire, A'],['P','power sent'],['V','line voltage']],
   ex:L.o.ph===3?`<code>I = ${big(S.P)} ÷ (1.732 × ${big(L.o.v)}) = ${fI(L.I)}</code>.`:`<code>I = ${big(S.P)} ÷ 230 = ${fI(L.I)}</code>.`,more:'Double the voltage and the current halves for the same power.'}),
 load:L=>({t:'Wire load',f:'load = I ÷ I<sub>rated</sub>',d:[['I<sub>rated</sub>','≈ 400 A for one 240 mm² copper conductor in air']],ex:`<code>${fI(L.I)} ÷ 400 A = ${Math.round(L.I/RATING*100)}%</code>. Above 100% the wire overheats; metal expands, so it sags.`}),
 loss:L=>{const n=L.o.ph===3?3:2,loss=n*L.I*L.I*RKM;return {t:'Heat lost in the wire',f:'P<sub>loss</sub> = n × I² × R × ℓ',d:[['n','number of wires carrying current (3, or 2 for 230 V)'],['R','0.0754 Ω per km for 240 mm² copper'],['ℓ','1 km']],
   ex:`<code>${n} × (${nice(L.I)})² × 0.0754 = ${fP(loss)}</code> per km, ${nice(loss/S.P*100)}% of the power.`,more:'Loss grows with current squared: 10× the voltage means 1/10 the current and 1/100 the loss.'};},
 peak:L=>({t:'Peak voltage to ground',f:'V<sub>pk</sub> = V<sub>LL</sub> × √2 ÷ √3',d:[['√2','AC rises to √2 ≈ 1.414 times its rated (RMS) value at each peak']],ex:`<code>${big(L.o.v)} × 1.414 ÷ ${L.o.ph===3?'1.732':'1'} = ${big(L.vpk)} V</code>.`}),
 spark:L=>({t:'How far a spark can jump',f:'d ≈ V<sub>pk</sub> ÷ E<sub>b</sub>',d:[['E<sub>b</sub>','breakdown strength of air: about 3 kV per mm in a small even gap, nearer 500 kV per m across longer gaps between a wire and an object']],ex:`<code>d ≈ ${big(L.vpk)} ÷ 500,000 = ${fM(flashGap(L.o))}</code>. Rough estimate: humidity, rain, dust and sharp edges change it.`}),
 keepout:L=>({t:'Keep-out distance',f:'d = 3.05 m (V ≤ 50 kV); d = 3.05 + 0.1016 × (V − 50) ÷ 10',d:[['V','line voltage in kV'],['rule','US OSHA, for people who are not trained line workers']],ex:`<code>${L.o.l}</code> → <code>${fM(approach(L.o.v))}</code>. The keep-out zone is far bigger than the spark distance: that margin covers wind, slips and long objects.`}),
 body:L=>({t:'Current through the body',f:'I = V ÷ R',d:[['V','phase-to-ground voltage'],['R','≈ 1,000 Ω for the body and ground path (teaching value)'],['100 mA','can stop the heart']],ex:`<code>I = ${big(L.vph)} ÷ 1,000 = ${fI(L.vph/1000)}</code>, ${big(L.vph/1000/0.1)}× the 100 mA danger level.`,more:'This is Ohm\'s law. Even 230 V gives 0.23 A through 1,000 Ω, which is already deadly.'}),
 gap:L=>({t:'When does the arc strike?',f:'arc if d ≤ d<sub>spark</sub>',d:[['d','gap between the object and the line'],['d<sub>spark</sub>','distance the voltage can push current through air']],ex:`At <code>${L.o.l}</code>: <code>d<sub>spark</sub> ≈ ${fM(flashGap(L.o))}</code>, keep-out <code>${fM(approach(L.o.v))}</code>. Gap now <code>${fM(arcS.gap)}</code>.`}),
 object:L=>({t:'Why the object matters',f:'R<sub>path</sub> small → I large',d:[['aluminium, steel','conduct well: current reaches the person'],['wet wood, rope','also conduct at high voltage']],ex:'A ladder or crane boom carries the current from the line to the person holding it. That is why metal ladders near lines are so dangerous.'})
};
let mathKey=null;
function openMath(k){ mathKey=k; const m=MATH[k](liveVals());
  $('mathbox').innerHTML=`<div class="mt"><b>${m.t}</b><button class="fx" id="mclose">Close ✕</button></div><div class="fml">${m.f}</div><dl>${m.d.map(d=>`<dt>${d[0]}</dt><dd>${d[1]}</dd>`).join('')}</dl><div class="ex"><b>With the current values:</b> ${m.ex}</div>${m.more?`<p class="note" style="margin:8px 0 0">${m.more}</p>`:''}`;
  $('mathbox').classList.remove('hide'); $('mclose').onclick=closeMath;
  document.querySelectorAll('.fx[data-math]').forEach(b=>b.classList.toggle('on',b.dataset.math===k)); }
function closeMath(){ mathKey=null; $('mathbox').classList.add('hide'); document.querySelectorAll('.fx[data-math]').forEach(b=>b.classList.remove('on')); }
document.addEventListener('click',e=>{ const b=e.target.closest('.fx[data-math]'); if(!b) return; if(mathKey===b.dataset.math) closeMath(); else openMath(b.dataset.math); });
let tick=0; function liveUpdate(){ if(++tick%10) return; renderReadings(false); if(mathKey){ const k=mathKey; openMath(k); } }

// ================= lecture mode =================
const LEC=[
 {m:'city',p:10,say:'10 W: one LED bulb. This is the smallest power on the ladder.'},
 {m:'city',p:1e3,say:'1 kW: about one home in the evening, or ten people pedalling as hard as they can.'},
 {m:'city',p:1e6,say:'1 MW is 1,000 kW: about 1,000 homes, a town. The first home is now a speck.'},
 {m:'city',p:5e7,say:'50 MW, the size of Bumbuna Hydro: about 50,000 homes.'},
 {m:'city',p:1e9,say:'1 GW, one large nuclear reactor: a million homes. Each glow is now a block of 100.'},
 {m:'impact',p:2e3,dur:0,tgt:'water',say:'Energy is power × time. A 2 kW kettle running for 1 minute boils less than half a litre.'},
 {m:'impact',p:5e3,dur:2,tgt:'diesel',say:'A small clinic using 5 kW for a day needs 120 kWh: about 40 litres of diesel in a generator.'},
 {m:'impact',p:1e6,dur:1,tgt:'lift',say:'1 MW for one hour is 1 MWh. That energy could lift a car 245 km, past the edge of space.'},
 {m:'wire',p:1e6,vi:0,say:'Send 1 MW at 230 V: over 4,000 A. The wire overheats, sags and melts.'},
 {m:'wire',p:1e6,vi:2,say:'The same 1 MW at 11 kV needs only about 52 A. This is why street lines run at 11 kV.'},
 {m:'wire',p:1e6,vi:6,say:'At 400 kV the current is under 2 A. High voltage carries big power with small current and small losses.'},
 {m:'arc',vi:2,obj:'ladder',walk:true,say:'You do not have to touch an 11 kV line. Get close enough and the current jumps the air.'},
 {m:'arc',vi:5,obj:'crane',walk:true,say:'At 225 kV the spark jumps over a third of a metre. Cranes and ladders near lines kill people every year.'}
];
let LI=-1;
function pickChip(row,idx){ [...$(row).querySelectorAll('.chip')].forEach((c,j)=>c.classList.toggle('on',j===idx)); }
function lecStep(i){ LI=Math.max(0,Math.min(LEC.length-1,i)); const s=LEC[LI];
  if(s.vi!==undefined){ S.vi=s.vi; pickChip('vrow',s.vi); }
  if(s.dur!==undefined){ S.dur=s.dur; pickChip('drow',s.dur); }
  if(s.tgt){ S.tgt=s.tgt; pickChip('trow',TG.findIndex(x=>x[0]===s.tgt)); }
  if(s.obj){ S.obj=s.obj; pickChip('orow',OBJ.findIndex(x=>x[1]===s.obj)); }
  if(S.mode!==s.m) setMode(s.m); else { if(s.m==='arc'){ setMode('arc'); } }
  if(s.p) setP(s.p);
  S.run0=performance.now();
  if(s.walk) setTimeout(()=>{ arcS.walking=true; },700);
  $('lstep').textContent=`Step ${LI+1} of ${LEC.length} · ${SCN[s.m].t.split(':')[0]}`; $('lsay').textContent=s.say; renderReadings(true); }
function lecOn(on){ $('lecbar').classList.toggle('hide',!on); $('lect').classList.toggle('on',on); $('lect').setAttribute('aria-pressed',on); $('lect').textContent=on?'■ Stop lecture':'▶ Lecture mode'; if(on) lecStep(LI<0?0:LI); }
$('lect').onclick=()=>lecOn($('lecbar').classList.contains('hide'));
$('lnext').onclick=()=>lecStep(LI+1); $('lprev').onclick=()=>lecStep(LI-1); $('lexit').onclick=()=>lecOn(false);
document.addEventListener('keydown',e=>{ if($('lecbar').classList.contains('hide')) return; if(/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if(e.key==='ArrowRight'){e.preventDefault();lecStep(LI+1);} else if(e.key==='ArrowLeft'){e.preventDefault();lecStep(LI-1);} });
if(window.ResizeObserver) new ResizeObserver(()=>resize()).observe(cv);

window.addEventListener('resize',resize);
function frame(t){ if(W===0) resize();
  if(S.mode==='city') drawCity(t); else if(S.mode==='wire') drawWire(t); else if(S.mode==='impact') drawImpact(t); else drawArc(t);
  liveUpdate();
  requestAnimationFrame(frame); }
const start=(location.hash||'').slice(1); setMode(['city','wire','impact','arc'].includes(start)?start:'city');
setP(5e4); resize(); requestAnimationFrame(frame);
document.fonts&&document.fonts.ready.then(()=>{cache.dirty=true;});
</script>
